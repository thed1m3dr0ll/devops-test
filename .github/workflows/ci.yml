name: CI Docker + Telegram

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest

      - name: Notify Telegram on success
        if: ${{ success() }}
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=✅ CI Pipeline завершён успешно!

📊 Детали:
Репозиторий: ${{ github.repository }}
Ветка: main
Коммит: ${{ github.sha }}
Автор: ${{ github.actor }}

🐳 Docker:
Образ: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest

✔️ Код получен
✔️ Docker собран
✔️ Образ загружен

🔗 Открыть: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "parse_mode=HTML"

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        run: |
          curl -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=🛑 CI Pipeline упал!

⚠️ Внимание: Сборка Docker-образа завершилась с ошибкой

📊 Детали:
Репозиторий: ${{ github.repository }}
Ветка: main
Коммит: ${{ github.sha }}
Автор: ${{ github.actor }}

❌ Статус:
❌ Docker НЕ собран
❌ Образ НЕ загружен

💡 Действие:
1️⃣ Проверить логи
2️⃣ Исправить Dockerfile
3️⃣ Запушить исправления

🔗 Открыть: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --data-urlencode "parse_mode=HTML"
