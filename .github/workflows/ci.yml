name: CI Docker + Telegram

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest

      - name: Notify Telegram on success
        if: ${{ success() }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          TEXT="✅ CI Pipeline завершён успешно!

📊 Детали:
Репозиторий: $REPO
Ветка: main
Коммит: $COMMIT
Автор: $ACTOR

🐳 Docker:
Образ: $USERNAME/my-web-app:latest

✔️ Код получен
✔️ Docker собран
✔️ Образ загружен

🔗 Открыть: https://github.com/$REPO/actions/runs/$RUN_ID"
          curl -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT"

      - name: Notify Telegram on failure
        if: ${{ failure() }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          REPO: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_ID: ${{ github.run_id }}
        run: |
          TEXT="🛑 CI Pipeline упал!

⚠️ Внимание: Сборка Docker-образа завершилась с ошибкой

📊 Детали:
Репозиторий: $REPO
Ветка: main
Коммит: $COMMIT
Автор: $ACTOR

❌ Статус:
❌ Docker НЕ собран
❌ Образ НЕ загружен

💡 Действие:
1️⃣ Проверить логи
2️⃣ Исправить Dockerfile
3️⃣ Запушить исправления

🔗 Открыть: https://github.com/$REPO/actions/runs/$RUN_ID"
          curl -X POST https://api.telegram.org/bot$BOT_TOKEN/sendMessage \
            --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$TEXT"
