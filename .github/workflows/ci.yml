name: CI Docker + Telegram

on:
  push:
    branches: [ main ]

jobs:
  build_and_push:
    name: Build and push Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-web-app:latest

      - name: Send Telegram notification
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            STATUS="✅ УСПЕХ"
            EMOJI="✅"
            TEXT="$EMOJI CI Pipeline завершён успешно! Образ загружен в Docker Hub."
          else
            STATUS="🛑 ОШИБКА"
            EMOJI="🛑"
            TEXT="$EMOJI CI Pipeline упал! Проверь логи."
          fi
          
          FULL_TEXT="$EMOJI Skatinov_dev DevOps CI
          
$TEXT

Репозиторий: ${{ github.repository }}
Ветка: main
Коммит: ${{ github.sha }}
Автор: ${{ github.actor }}

🔗 Логи: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          
          curl -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            --data-urlencode "chat_id=${{ secrets.TELEGRAM_CHAT_ID }}" \
            --data-urlencode "text=$FULL_TEXT"
